<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Promtify AI logo</title>
  <desc id="desc">A gradient letter P with a code chevron and AI sparkle.</desc>
  <defs>
    <linearGradient id="pGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51D8FF"/>
      <stop offset=".38" stop-color="#3478FF"/>
      <stop offset=".72" stop-color="#8B35FF"/>
      <stop offset="1" stop-color="#FF5BD7"/>
    </linearGradient>
    <linearGradient id="sparkGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D7FF"/>
      <stop offset="1" stop-color="#E94DFF"/>
